# 予備：Nyansoro.xcodeproj が開けないときは、Mac のターミナルで
#   brew install xcodegen
#   xcodegen
# を実行すると、この設定から Nyansoro.xcodeproj を作り直せます。
name: Nyansoro
options:
  bundleIdPrefix: com.nonoka
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Nyansoro:
    type: application
    platform: iOS
    sources:
      - path: Nyansoro
      - path: NyansoroCore/Sources/NyansoroCore
        group: NyansoroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nonoka.nyansoro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: にゃんそろ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: G5C48HHDMM
