# Mac 上で自動ビルド：ルールのテスト、iOS アプリのビルド、シミュレーターでの画面の撮影
name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: ルールのテスト
        working-directory: NyansoroCore
        run: swift test

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode のバージョン
        run: xcodebuild -version
      - name: シミュレーター向けにビルド
        run: |
          set -o pipefail
          xcodebuild -project Nyansoro.xcodeproj -scheme Nyansoro -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: リリース用もビルド（広告 ID が空でも通るか）
        run: |
          set -o pipefail
          xcodebuild -project Nyansoro.xcodeproj -scheme Nyansoro -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a build.log
      - name: エラーだけ抜き出す
        if: failure()
        run: |
          grep -E "error:|warning: .*(will be an error|is unavailable)" build.log | sort -u | head -100

  screenshots:
    runs-on: macos-15
    needs: ios-build
    steps:
      - uses: actions/checkout@v5
      - name: シミュレーターで画面を撮る
        run: scripts/screenshots.sh
      - name: 画面をダウンロードできるようにする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
